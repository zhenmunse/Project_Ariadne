* { margin:0; padding:0; box-sizing:border-box; }

.btn:hover { background: #21262d; border-color: #484f58; }

#legend {

  border: 1px solid #21262d; border-radius: 8px; padding: 10px 14px;

.legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

#tooltip {
  position: fixed; pointer-events: none; z-index: 20;
  background: rgba(22,27,34,0.97); backdrop-filter: blur(12px);
  border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px;
  font-size: 12px; max-width: 320px; display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
#tooltip .tt-name { 
  font-family: 'JetBrains Mono', monospace; font-weight: 600;
  color: #e6edf3; font-size: 13px; margin-bottom: 4px;
}
#tooltip .tt-meta { color: #7d8590; font-size: 11px; margin-bottom: 6px; }
#tooltip .tt-section { margin-top: 6px; }
#tooltip .tt-label { 
  font-family: 'JetBrains Mono', monospace; font-size: 10px; 
  color: #7d8590; text-transform: uppercase; letter-spacing: 0.05em;
}
#tooltip .tt-list { color: #c9d1d9; font-size: 11px; margin-top: 2px; }

svg { width: 100vw; height: 100vh; }

.edge { fill: none; stroke-width: 1; }
.edge.essential { stroke: #30363d; }
.edge.transitive { stroke: #21262d; stroke-dasharray: 4,3; }

.node-group { cursor: pointer; }
.node-rect { rx: 4; ry: 4; stroke-width: 1.5; stroke: transparent; }
.node-label {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  fill: #fff; text-anchor: middle; dominant-baseline: central;
  pointer-events: none;
}
.node-id {
  font-family: 'JetBrains Mono', monospace; font-size: 7px;
  fill: rgba(255,255,255,0.6); text-anchor: middle;
  pointer-events: none;
}

.node-group.dimmed .node-rect { opacity: 0.15; }
.node-group.dimmed .node-label, .node-group.dimmed .node-id { opacity: 0.1; }
.edge.dimmed { opacity: 0.04; }

.node-group.highlighted .node-rect { stroke: #e6edf3; stroke-width: 2; }
.node-group.ancestor .node-rect { stroke: #f0883e; stroke-width: 2; }
.node-group.descendant .node-rect { stroke: #3fb950; stroke-width: 2; }

.edge.highlighted-ancestor { stroke: #f0883e !important; stroke-width: 2; opacity: 1 !important; }
.edge.highlighted-descendant { stroke: #3fb950 !important; stroke-width: 2; opacity: 1 !important; }

DATA.nodes.forEach(n => {
  if (!layers[n.layer]) layers[n.layer] = [];
  layers[n.layer].push(n);
});

const NODE_W = 130, NODE_H = 28, PAD_X = 16, PAD_Y = 70;
const maxLayer = Math.max(...Object.keys(layers).map(Number));
const maxWidth = Math.max(...Object.values(layers).map(l => l.length));

// Sort within each layer by teaching_order for consistency
Object.values(layers).forEach(l => l.sort((a,b) => a.teaching_order - b.teaching_order));

// Position
DATA.nodes.forEach(n => {
  const layerNodes = layers[n.layer];
  const idx = layerNodes.indexOf(n);
  const count = layerNodes.length;
  const totalW = count * (NODE_W + PAD_X);
  n.x = (idx - (count-1)/2) * (NODE_W + PAD_X);
  n.y = n.layer * (NODE_H + PAD_Y);
});

// SVG setup
const svg = d3.select('#canvas');
const g = svg.append('g');

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.15, 3])
  .on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

// Initial transform: center the graph
function fitView() {
  const xs = DATA.nodes.map(n => n.x), ys = DATA.nodes.map(n => n.y);
  const minX = Math.min(...xs) - NODE_W, maxX = Math.max(...xs) + NODE_W;
  const minY = Math.min(...ys) - NODE_H, maxY = Math.max(...ys) + NODE_H;
  const w = window.innerWidth, h = window.innerHeight - 50;
  const gw = maxX - minX, gh = maxY - minY;
  const scale = Math.min(w / gw, h / gh) * 0.9;
  const tx = w/2 - (minX + maxX)/2 * scale;
  const ty = h/2 - (minY + maxY)/2 * scale + 25;
  svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

// Arrow marker
svg.append('defs').append('marker')
  .attr('id', 'arrow').attr('viewBox', '0 0 10 6')
  .attr('refX', 10).attr('refY', 3)
  .attr('markerWidth', 8).attr('markerHeight', 6)
  .attr('orient', 'auto')
  .append('path').attr('d', 'M0,0 L10,3 L0,6 Z').attr('fill', '#30363d');

svg.select('defs').append('marker')
  .attr('id', 'arrow-ancestor').attr('viewBox', '0 0 10 6')
  .attr('refX', 10).attr('refY', 3)
  .attr('markerWidth', 8).attr('markerHeight', 6)
  .attr('orient', 'auto')
  .append('path').attr('d', 'M0,0 L10,3 L0,6 Z').attr('fill', '#f0883e');

svg.select('defs').append('marker')
  .attr('id', 'arrow-descendant').attr('viewBox', '0 0 10 6')
  .attr('refX', 10).attr('refY', 3)
  .attr('markerWidth', 8).attr('markerHeight', 6)
  .attr('orient', 'auto')
  .append('path').attr('d', 'M0,0 L10,3 L0,6 Z').attr('fill', '#3fb950');

// Draw edges
const edgeGroup = g.append('g').attr('class', 'edges');
const edgeEls = edgeGroup.selectAll('.edge')
  .data(DATA.edges)
  .enter().append('path')
  .attr('class', d => 'edge ' + (d.essential ? 'essential' : 'transitive'))
  .attr('d', d => {
    const s = nodeMap[d.source], t = nodeMap[d.target];
    const sy = s.y + NODE_H/2, ty = t.y - NODE_H/2;
    const mx = (s.x + t.x) / 2, my = (sy + ty) / 2;
    return `M${s.x},${sy} C${s.x},${my} ${t.x},${my} ${t.x},${ty}`;
  })
  .attr('marker-end', 'url(#arrow)');

// Draw nodes
const nodeGroup = g.append('g').attr('class', 'nodes');
const nodeEls = nodeGroup.selectAll('.node-group')
  .data(DATA.nodes)
  .enter().append('g')
  .attr('class', 'node-group')
  .attr('transform', d => `translate(${d.x - NODE_W/2}, ${d.y - NODE_H/2})`);

nodeEls.append('rect')
  .attr('class', 'node-rect')
  .attr('width', NODE_W).attr('height', NODE_H)
  .attr('fill', d => BLOCK_COLORS[d.block] || '#555');

nodeEls.append('text')
  .attr('class', 'node-label')
  .attr('x', NODE_W/2).attr('y', NODE_H/2)
  .text(d => {
    const name = d.name;
    const maxLen = 18;
    return name.length > maxLen ? name.slice(0, maxLen-1) + '…' : name;
  });

nodeEls.append('text')
  .attr('class', 'node-id')
  .attr('x', NODE_W/2).attr('y', -4)
  .text(d => d.id);

// Hover interactions
function getAncestors(id) {
  const set = new Set();
  const queue = [id];
  while (queue.length) {
    const n = queue.pop();
    parents[n].forEach(p => { if (!set.has(p)) { set.add(p); queue.push(p); } });
  }
  return set;
}
function getDescendants(id) {
  const set = new Set();
  const queue = [id];
  while (queue.length) {
    const n = queue.pop();
    children[n].forEach(c => { if (!set.has(c)) { set.add(c); queue.push(c); } });
  }
  return set;
}

const tooltip = d3.select('#tooltip');

nodeEls.on('mouseenter', function(event, d) {
  const anc = getAncestors(d.id);
  const desc = getDescendants(d.id);
  const related = new Set([d.id, ...anc, ...desc]);

  nodeEls.classed('dimmed', n => !related.has(n.id))
    .classed('highlighted', n => n.id === d.id)
    .classed('ancestor', n => anc.has(n.id))
    .classed('descendant', n => desc.has(n.id));

  edgeEls.classed('dimmed', e => !related.has(e.source) || !related.has(e.target))
    .classed('highlighted-ancestor', e => anc.has(e.source) && (anc.has(e.target) || e.target === d.id))
    .classed('highlighted-descendant', e => (desc.has(e.target)) && (desc.has(e.source) || e.source === d.id))
    .attr('marker-end', e => {
      if (anc.has(e.source) && (anc.has(e.target) || e.target === d.id)) return 'url(#arrow-ancestor)';
      if ((desc.has(e.target)) && (desc.has(e.source) || e.source === d.id)) return 'url(#arrow-descendant)';
      return 'url(#arrow)';
    });

  // Tooltip
  const prereqNames = parents[d.id].map(p => `${p}: ${nodeMap[p].name}`).join(', ') || 'none (root)';
  const supportNames = children[d.id].map(c => `${c}: ${nodeMap[c].name}`).join(', ') || 'none (leaf)';

  tooltip.select('.tt-name').text(`${d.id}: ${d.name}`);
  tooltip.select('.tt-meta').text(`${d.block} · Week ${d.week} · Bloom ${d.bloom} · Order ${d.teaching_order}`);
  tooltip.select('.tt-prereqs .tt-list').text(prereqNames);
  tooltip.select('.tt-supports .tt-list').text(supportNames);
  tooltip.style('display', 'block');
})
.on('mousemove', function(event) {
  const x = event.clientX, y = event.clientY;
  const ttW = 320, margin = 16;
  const left = x + ttW + margin > window.innerWidth ? x - ttW - margin : x + margin;
  const top = Math.min(y + margin, window.innerHeight - 200);
  tooltip.style('left', left + 'px').style('top', top + 'px');
})
.on('mouseleave', function() {
  nodeEls.classed('dimmed highlighted ancestor descendant', false);
  edgeEls.classed('dimmed highlighted-ancestor highlighted-descendant', false)
    .attr('marker-end', 'url(#arrow)');
  tooltip.style('display', 'none');
});

// Edge toggle
let showAll = true;
d3.select('#btn-all').on('click', () => {
  showAll = true;
  edgeEls.style('display', null);
  d3.select('#btn-all').classed('active', true);
  d3.select('#btn-essential').classed('active', false);
});
d3.select('#btn-essential').on('click', () => {
  showAll = false;
  edgeEls.style('display', d => d.essential ? null : 'none');
  d3.select('#btn-all').classed('active', false);
  d3.select('#btn-essential').classed('active', true);
});

// Search
d3.select('#search-box').on('input', function() {
  const q = this.value.toLowerCase().trim();
  if (!q) {
    nodeEls.classed('dimmed', false);
    edgeEls.classed('dimmed', false);
    return;
  }
  const matches = new Set();
  DATA.nodes.forEach(n => {
    if (n.name.includes(q) || String(n.id) === q || n.block.toLowerCase().includes(q)) {
      matches.add(n.id);
    }
  });
  nodeEls.classed('dimmed', n => !matches.has(n.id));
  edgeEls.classed('dimmed', e => !matches.has(e.source) && !matches.has(e.target));
});

// Reset
d3.select('#btn-reset').on('click', fitView);

// Legend
const legendDiv = d3.select('#legend-items');
BLOCK_ORDER.forEach(b => {
  const count = DATA.nodes.filter(n => n.block === b).length;
  const item = legendDiv.append('div').attr('class', 'legend-item');
  item.append('div').attr('class', 'legend-dot').style('background', BLOCK_COLORS[b]);
  item.append('span').text(`${b} (${count})`);
});

// Init
fitView();
</script>
</body>
</html>
